[project]
name = "tile-mapper-seg-fg"
version = "0.1.0"
description = "End-to-End Geospatial AI Tiling, KML Corridor Extraction, and Semantic Segmentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "osmium>=4.3.0",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "rasterio>=1.4.0",
    "numpy>=2.0.0",
    "pillow>=10.0.0",
    "pyproj>=3.6.0",
    "pyogrio>=0.9.0",
    "mercantile>=1.2.1",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "cactus-compute>=4.2.0",
    "huggingface-hub>=0.23.0",
]
